# Konfigurasi Supabase CLI untuk proyek Drive Tech.
# Sengaja minimal: hanya kunci yang benar-benar dipakai.
project_id = "drive-tech"

[api]
enabled = true
port = 55321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
major_version = 15

[studio]
enabled = true
port = 55323

[auth]
enabled = true
site_url = "http://localhost:3000"
# Pendaftaran mandiri dimatikan: admin dibuat manual oleh panitia.
enable_signup = false

[storage]
enabled = true
# Bukti transfer dibatasi 2 MB (sama dengan MAX_PROOF_BYTES di aplikasi).
file_size_limit = "2MiB"

# Analytics (container vector) dimatikan: mencoba mount docker.sock colima yang
# sudah tidak ada di mesin ini, dan tidak dibutuhkan aplikasi.
[analytics]
enabled = false
